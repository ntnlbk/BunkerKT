<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUNKER | Spectator Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap"
          rel="stylesheet">
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
        }

        .font-mono {
            font-family: 'Share Tech Mono', monospace;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #0c0a09;
        }

        ::-webkit-scrollbar-thumb {
            background: #10b981;
            border-radius: 2px;
        }
    </style>
</head>
<body class="min-h-screen lg:h-screen flex flex-col bg-slate-950 text-slate-200 overflow-x-hidden lg:overflow-hidden font-mono">

<header class="w-full px-3 py-2 flex flex-col sm:flex-row justify-between items-center border-b border-emerald-900/40 bg-slate-950 shrink-0 gap-2">
    <div class="flex items-center space-x-2">
        <i class="fa-solid fa-eye text-emerald-500 text-lg animate-pulse"></i>
        <span class="text-xs sm:text-sm font-bold tracking-widest text-emerald-400">BUNKER // SPECTATOR</span>
        <span id="stageBadge"
              class="text-[10px] px-2 py-0.5 rounded border font-bold tracking-wider bg-emerald-500/10 text-emerald-400 border-emerald-500/30">
            MAIN_PHASE
        </span>
    </div>
    <div class="flex items-center space-x-2 w-full sm:w-auto justify-between sm:justify-end flex-wrap">
        <div class="text-[11px] sm:text-xs text-emerald-400 bg-emerald-500/10 px-2 py-1 rounded border border-emerald-500/30 truncate">
            ROOM: <span id="headerRoomCode">---</span> | YOU: <span id="headerPlayerName">---</span>
        </div>
    </div>
</header>

<main class="flex-1 flex flex-col p-2 sm:p-3 overflow-y-auto lg:overflow-hidden space-y-2">

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 shrink-0">
        <div class="bg-slate-900 border border-slate-800 rounded p-2">
                <span class="text-[10px] text-emerald-400 font-bold uppercase block border-b border-slate-800 pb-0.5 mb-1">
                    <i class="fa-solid fa-radiation mr-1"></i> Apocalypse
                </span>
            <p class="text-xs text-slate-300 leading-snug">Global pandemic of mutagenic virus. Atmosphere toxic.</p>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded p-2">
                <span class="text-[10px] text-emerald-400 font-bold uppercase block border-b border-slate-800 pb-0.5 mb-1">
                    <i class="fa-solid fa-shield-halved mr-1"></i> Bunker
                </span>
            <p class="text-xs text-slate-300 leading-snug">Class A-4 shelter. Capacity: 6 survivors. Autonomy: 1
                year.</p>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded p-2">
                <span class="text-[10px] text-emerald-400 font-bold uppercase block border-b border-slate-800 pb-0.5 mb-1">
                    <i class="fa-solid fa-box-archive mr-1"></i> Inventory
                </span>
            <p class="text-xs text-slate-300 leading-snug">Generator, 6mo food reserves, medical kit, water filters.</p>
        </div>
    </div>
    <div class="flex-1 flex flex-col min-h-0">
        <div class="flex items-center justify-between mb-1.5 shrink-0 px-1">
            <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wide"><i
                    class="fa-solid fa-users mr-1"></i> Shelter Roster</h2>
            <span class="text-[10px] text-slate-400">12 Slots</span>
        </div>

        <div id="playersGrid"
             class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-2.5 pb-4 lg:pb-0 lg:flex-1 lg:overflow-y-auto">
        </div>
    </div>

</main>

<script src="/js/spectator_script.js"> </script>
</body>
</html>
